<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CurveStack Surface Gen</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Space Mono', 'monospace'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            colors: {
              primary: {
                500: '#3b82f6',
                600: '#2563eb',
              },
              dark: {
                bg: '#0a0a0a',
                panel: 'rgba(23, 23, 23, 0.75)',
                border: '#262626'
              },
              light: {
                bg: '#f8fafc',
                panel: 'rgba(255, 255, 255, 0.75)',
                border: '#e2e8f0'
              }
            },
            animation: {
              'spin-slow': 'spin 3s linear infinite',
            }
          }
        }
      }
    </script>
    <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "react-dom/": "https://esm.sh/react-dom@^18.2.0/",
    "three/": "https://esm.sh/three@^0.182.0/",
    "react": "https://esm.sh/react@^18.2.0",
    "react/": "https://esm.sh/react@^18.2.0/",
    "framer-motion": "https://esm.sh/framer-motion@11.0.8"
  }
}
</script>
    <style>
      body { margin: 0; overflow: hidden; }
      /* Custom scrollbar for panels */
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #525252; border-radius: 2px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #737373; }
      
      .glass-panel {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
